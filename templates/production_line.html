{% extends "base.html" %}

{% block content %}
<h2 class="mb-4">Production Line Flow</h2>

<div class="card shadow-sm border-0 mb-4">
    <div class="card-body p-5">
        <div class="d-flex justify-content-between align-items-center flex-wrap">
            {% for s in stations %}
            <div class="text-center mb-3">
                <div class="rounded-circle d-flex align-items-center justify-content-center mx-auto mb-2 {% if s.status == 'Active' %}bg-primary text-white{% else %}bg-light text-dark border{% endif %}" style="width: 80px; height: 80px; font-size: 1.5rem;">
                    <i class="bi bi-gear{% if s.status == 'Active' %} text-white{% endif %}"></i>
                </div>
                <h5 class="mb-1">{{ s.name }}</h5>
                <span class="badge {% if s.status == 'Active' %}bg-success{% else %}bg-secondary{% endif %}">{{ s.status }}</span>
                <div class="small mt-1 text-muted">{{ s.count }} units</div>
                <a href="{{ url_for('products', station=s.name) }}" class="btn btn-sm btn-outline-primary mt-2" aria-label="View products at {{ s.name }}">View products</a>
            </div>
            {% if not loop.last %}
            <div class="flex-grow-1 text-center d-none d-md-block">
                <i class="bi bi-arrow-right display-6 text-muted"></i>
            </div>
            {% endif %}
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
